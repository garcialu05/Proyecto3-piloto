<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estadísticas de Pilotos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Lucia y Samantha</h1>
        <p>Proyecto de práctica con Git y GitHub</p>
    </header>

    <main>

        <section class="contenedor-pilotos">

            <!-- PILOTO 1 -->
            <div class="card-piloto">

                <h2 id="nombre">Charles Leclerc</h2>

                <p class="equipo">Ferrari</p>

                <div class="estadisticas">

                    <p>
                        <strong>Carreras:</strong>
                        <span id="carreras1">0</span>
                    </p>

                    <p>
                        <strong>Victorias:</strong>
                        <span id="victorias1">0</span>
                    </p>

                    <p>
                        <strong>Podios:</strong>
                        <span id="podios1">0</span>
                    </p>

                </div>

            </div>


            <!-- PILOTO 2 -->
            <div class="card-piloto">

                <h2 id="nombre2">Lando Norris</h2>

                <p class="equipo">McLaren</p>

                <div class="estadisticas">

                    <p>
                        <strong>Carreras:</strong>
                        <span id="carreras2">0</span>
                    </p>

                    <p>
                        <strong>Victorias:</strong>
                        <span id="victorias2">0</span>
                    </p>

                    <p>
                        <strong>Podios:</strong>
                        <span id="podios2">0</span>
                    </p>

                </div>

            </div>

        </section>


        <!-- BOTÓN -->
        <section class="controles">

            <button id="btnCambio">
                Mostrar estadísticas
            </button>

            <p id="aviso">
                Presiona el botón para mostrar las estadísticas.
            </p>

        </section>

    </main>


    <footer>
        <p>Proyecto 3 · Práctica Git</p>
    </footer>


    <script src="app.js"></script>

</body>
</html>
